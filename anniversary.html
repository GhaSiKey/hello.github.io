<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>一周年快乐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Cormorant Garamond：标题衬线；Ma Shan Zheng：中文手写体（结尾的话） -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/anniversary/style.css">
</head>
<body>
  <!-- 柔光氛围背景 -->
  <div class="bg" aria-hidden="true">
    <span class="bg-orb bg-orb-1"></span>
    <span class="bg-orb bg-orb-2"></span>
    <span class="bg-orb bg-orb-3"></span>
  </div>
  <!-- 飘落花瓣/光点（JS 注入） -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- ① 口令门帘 -->
  <section class="gate" id="gate">
    <div class="gate-inner">
      <p class="gate-q">我们开始的那天，是几月几号？</p>
      <form class="gate-form" id="gateForm" autocomplete="off">
        <div class="gate-picker">
          <div class="gate-field">
            <select class="gate-select" id="gateMonth" aria-label="月份"></select>
            <span class="gate-unit">月</span>
          </div>
          <div class="gate-field">
            <select class="gate-select" id="gateDay" aria-label="日期"></select>
            <span class="gate-unit">日</span>
          </div>
        </div>
        <button class="gate-btn" type="submit">开始</button>
      </form>
      <p class="gate-hint" id="gateHint"></p>
    </div>
  </section>

  <!-- 主体：单屏，不滚动 -->
  <main class="stage" id="stage" hidden>
    <!-- ② 顶部标题（精简，常驻顶部）-->
    <header class="hero" id="hero">
      <p class="hero-kicker">FOR 婷 · 高世奇</p>
      <h1 class="hero-title">一周年快乐</h1>
      <p class="hero-days">
        <span class="hero-range">2025.06.30 → 2026.06.30</span>
        <span class="hero-dot">·</span>
        在一起第 <b id="dayCount">—</b> 天
      </p>
    </header>

    <!-- ③ 漂浮照片墙：拍立得由 JS 注入，一屏内自动轮转 -->
    <section class="wall" id="wall" aria-label="这一年的照片"></section>

    <!-- ④ 结尾的话（底部常驻）-->
    <footer class="letter">
      <p class="letter-text" id="letterText"></p>
    </footer>
  </main>

  <!-- 放大查看层 -->
  <div class="viewer" id="viewer" hidden>
    <img class="viewer-img" id="viewerImg" alt="">
    <span class="viewer-close" id="viewerClose" aria-label="关闭">✕</span>
  </div>

  <!-- BGM：进入舞台后自动播放 -->
  <audio id="bgm" src="assets/anniversary/bgm.mp3" loop preload="auto"></audio>

  <!-- 右上角控制条：轮播开关 + BGM 开关 -->
  <div class="controls" id="controls" hidden>
    <button class="ctrl-btn" id="slideToggle" type="button" aria-label="暂停/继续照片轮播">
      <svg class="ctrl-photo" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <!-- 中间：照片(相框+山峰+太阳)，静止 -->
        <rect x="7" y="8.5" width="10" height="8" rx="1.6" fill="none"
              stroke="currentColor" stroke-width="1.7"/>
        <circle cx="10" cy="11.3" r="1" fill="currentColor"/>
        <path d="M8 15l2.3-2.3 1.5 1.5L14 12l2 2.2" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 外圈：循环刷新双箭头，运行时绕中心旋转 -->
        <g class="ctrl-refresh">
          <path d="M5 8.5a8 8 0 0 1 13-2.2" fill="none"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M18.3 3.2l.4 3.4-3.4.2" fill="none"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 16.5a8 8 0 0 1-13 2.2" fill="none"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M5.7 21.8l-.4-3.4 3.4-.2" fill="none"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </button>
    <button class="ctrl-btn" id="musicToggle" type="button" aria-label="播放/暂停背景音乐">
      <span class="music-bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
    </button>
  </div>

  <script src="assets/anniversary/app.js"></script>
</body>
</html>
