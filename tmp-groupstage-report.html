<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>小组赛战绩 · Q2财报</title>
<style>
:root{
  --bg:#0a0e1a; --surface:rgba(255,255,255,0.04); --surface-2:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08); --text:#e8ecf4; --dim:#9aa3b5; --faint:#6b7488;
  --red:#ff6b5b; --green:#38d39f; --gold:#ffd98a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
.title{font-size:20px;font-weight:800;margin-bottom:4px}
.subtitle{font-size:12px;color:var(--faint);margin-bottom:20px}
/* 汇总卡 2x2 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:22px 24px;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.03),transparent);pointer-events:none}
.c-label{font-size:13px;color:var(--dim);margin-bottom:10px}
.c-value{font-size:30px;font-weight:800;letter-spacing:-0.5px}
.c-value.neg{color:var(--red)} .c-value.pos{color:var(--green)}
.c-sub{font-size:12px;color:var(--faint);margin-top:8px}
/* 图表区 */
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 18px}
.chart-title{font-size:14px;font-weight:700;margin-bottom:2px}
.chart-sub{font-size:11px;color:var(--faint);margin-bottom:16px}
canvas{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%}
@media(max-width:560px){.c-value{font-size:24px}.grid{gap:10px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">🎰 AI 模拟买盘 · 小组赛战绩</div>
  <div class="subtitle">2026 World Cup · Q2 小组赛财报 · 72场全结算（娱乐复盘，非投注建议）</div>

  <div class="grid">
    <div class="card"><div class="c-label">总支出</div><div class="c-value">¥1440</div><div class="c-sub">预算 72 场</div></div>
    <div class="card"><div class="c-label">已结算收入</div><div class="c-value">¥1229.3</div><div class="c-sub">投入 ¥1440</div></div>
    <div class="card"><div class="c-label">已结算盈亏</div><div class="c-value neg">-¥210.7 ▼</div><div class="c-sub">ROI -14.6%</div></div>
    <div class="card"><div class="c-label">命中率</div><div class="c-value">54/215</div><div class="c-sub">已结算 72/72 场</div></div>
  </div>

  <div class="chart-box">
    <div class="chart-title">📉 累计收益曲线</div>
    <div class="chart-sub">按结算顺序 · 峰值 +51.4(第8场) → 谷值 -224.1(第57场) → 收官 -210.7</div>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:var(--gold)"></i>累计盈亏</span>
      <span><i class="dot" style="background:var(--faint)"></i>盈亏平衡线</span>
      <span>每点=1场</span>
    </div>
  </div>
</div>

<script>
const data = JSON.parse(document.getElementById('curve').textContent);
const cv = document.getElementById('chart');
const ctx = cv.getContext('2d');

function draw(){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 240;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const padL=44, padR=12, padT=16, padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const vals=data.map(d=>d.c);
  let mn=Math.min(...vals,0), mx=Math.max(...vals,0);
  const pad=(mx-mn)*0.1||10; mn-=pad; mx+=pad;
  const x=i=>padL+plotW*i/(data.length-1);
  const y=v=>padT+plotH*(mx-v)/(mx-mn);

  // 网格+Y轴标签
  ctx.font='10px sans-serif'; ctx.fillStyle='#6b7488'; ctx.textAlign='right';
  const steps=5;
  for(let s=0;s<=steps;s++){
    const v=mn+(mx-mn)*s/steps, yy=y(v);
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.beginPath();
    ctx.moveTo(padL,yy); ctx.lineTo(W-padR,yy); ctx.stroke();
    ctx.fillText(Math.round(v),padL-6,yy+3);
  }
  // 零线(盈亏平衡)
  const zy=y(0);
  ctx.strokeStyle='rgba(154,163,181,0.5)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,zy); ctx.lineTo(W-padR,zy); ctx.stroke(); ctx.setLineDash([]);

  // 面积填充(分正负色)
  const grad=ctx.createLinearGradient(0,padT,0,padT+plotH);
  grad.addColorStop(0,'rgba(255,217,138,0.18)'); grad.addColorStop(1,'rgba(255,107,91,0.04)');
  ctx.beginPath(); ctx.moveTo(x(0),y(data[0].c));
  data.forEach((d,i)=>ctx.lineTo(x(i),y(d.c)));
  ctx.lineTo(x(data.length-1),zy); ctx.lineTo(x(0),zy); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();

  // 主曲线
  ctx.beginPath(); ctx.moveTo(x(0),y(data[0].c));
  data.forEach((d,i)=>ctx.lineTo(x(i),y(d.c)));
  ctx.strokeStyle='#ffd98a'; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();

  // 标注峰值/谷值/终点
  const peak=data.reduce((a,b)=>b.c>a.c?b:a), trough=data.reduce((a,b)=>b.c<a.c?b:a), end=data[data.length-1];
  function mark(d,color,txt,above){
    const i=data.indexOf(d), px=x(i), py=y(d.c);
    ctx.beginPath(); ctx.arc(px,py,3.5,0,7); ctx.fillStyle=color; ctx.fill();
    ctx.fillStyle=color; ctx.font='bold 10px sans-serif';
    ctx.textAlign = px>W-60?'right':'left';
    ctx.fillText(txt, px+(px>W-60?-6:6), py+(above?-7:14));
  }
  mark(peak,'#38d39f','峰 +'+peak.c.toFixed(0),true);
  mark(trough,'#ff6b5b','谷 '+trough.c.toFixed(0),false);
  mark(end,'#ffd98a','收官 '+end.c.toFixed(1),true);

  // X轴起止日期
  ctx.fillStyle='#6b7488'; ctx.font='10px sans-serif';
  ctx.textAlign='left'; ctx.fillText(data[0].d,padL,H-8);
  ctx.textAlign='right'; ctx.fillText(data[data.length-1].d,W-padR,H-8);
}
draw();
window.addEventListener('resize',draw);
</script>
