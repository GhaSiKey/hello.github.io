<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上海地铁运行图 · 模拟</title>
  <!-- MapLibre GL JS：开源，无需 key -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="assets/shmetro/css/shmetro.css">
</head>
<body>
  <!-- 地图容器 -->
  <div id="map"></div>

  <!-- 左上角：时钟 + 标注 + 可展开数据面板 -->
  <div class="hud" id="hud">
    <div class="hud-title">上海地铁运行图</div>
    <div class="hud-clock" id="hudClock">--:--:--</div>
    <div class="hud-date" id="hudDate"></div>
    <button class="hud-running" id="hudRunning" aria-expanded="false">
      <span id="hudRunningText">— 列运行中</span>
      <span class="hud-caret" aria-hidden="true">▾</span>
    </button>
    <div class="hud-panel" id="hudPanel" hidden></div>
    <div class="hud-badge">模拟运行图 · 非实时数据</div>
  </div>

  <!-- 右上角工具条：收藏 + 站点搜索 -->
  <div class="toolbar" id="toolbar">
    <!-- 我的收藏 -->
    <div class="fav" id="fav">
      <button class="fav-toggle" id="favToggle" aria-label="我的收藏" title="我的收藏" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 3.5l2.6 5.27 5.82.85-4.21 4.1.99 5.79L12 16.77l-5.2 2.73.99-5.79-4.21-4.1 5.82-.85z"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span class="fav-count" id="favCount" hidden>0</span>
      </button>
      <div class="fav-panel" id="favPanel" hidden></div>
    </div>

    <!-- 站点搜索（图标展开式） -->
    <div class="search" id="search">
      <button class="search-toggle" id="searchToggle" aria-label="搜索站点" title="搜索站点">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="search-toggle-text">搜索站点</span>
      </button>
      <div class="search-box" id="searchBox" hidden>
        <input type="text" class="search-input" id="searchInput"
               placeholder="搜索站点（支持拼音、首字母）" autocomplete="off" />
        <button class="search-close" id="searchClose" aria-label="关闭">✕</button>
        <ul class="search-results" id="searchResults"></ul>
      </div>
    </div>
  </div>

  <!-- 图例（线路开关） -->
  <div class="legend" id="legend"></div>

  <!-- 线路详情吸底条（点击图例线路时展开） -->
  <div class="line-bar" id="lineDetail" hidden></div>

  <!-- 列车信息气泡（点击列车弹出） -->
  <div class="train-popup" id="trainPopup" hidden></div>

  <!-- 错误态 -->
  <div class="error-state" id="errorState" hidden>
    <span class="error-icon">😵</span>
    <p class="error-text">数据加载失败</p>
    <p class="error-hint" id="errorHint"></p>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="assets/shmetro/js/data.js"></script>
  <script src="assets/shmetro/js/geo.js"></script>
  <script src="assets/shmetro/js/scheduler.js"></script>
  <script src="assets/shmetro/js/render.js"></script>
  <script src="assets/shmetro/js/app.js"></script>
</body>
</html>
