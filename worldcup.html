<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界杯赔率 · 2026 FIFA World Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/worldcup.css">
</head>
<body>
  <!-- 动态背景：深色 + 金色冠军氛围 -->
  <div class="bg-gradient"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-shine"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🏆</span>
        <div class="logo-text">
          <h1 class="logo-title">世界杯赔率</h1>
          <span class="logo-sub">2026 · FIFA WORLD CUP</span>
        </div>
      </div>
      <div class="header-meta" id="headerMeta"></div>
    </header>

    <!-- 标题装饰金线 -->
    <div class="title-rule"></div>

    <!-- 工具栏：视图切换 -->
    <nav class="toolbar">
      <div class="view-tabs" id="viewTabs">
        <button class="view-tab active" data-view="date">按日期</button>
        <button class="view-tab" data-view="group">按小组</button>
      </div>
    </nav>

    <!-- 主内容：分组 + 卡片 -->
    <main class="match-list" id="matchList">
      <!-- 骨架屏 -->
      <div class="skeleton-wrap" id="skeleton"></div>
      <!-- 卡片由 JS 渲染 -->
      <div class="groups" id="groups"></div>
      <!-- 错误态 -->
      <div class="error-state" id="errorState" hidden>
        <span class="error-icon">😵</span>
        <p class="error-text">数据加载失败</p>
        <p class="error-hint" id="errorHint"></p>
      </div>
    </main>

    <!-- 全局免责声明 -->
    <footer class="disclaimer" id="disclaimer"></footer>
  </div>

  <!-- 详情：Web 滑出面板 / H5 全屏页（同一 DOM，CSS 切换形态）-->
  <div class="detail-overlay" id="detailOverlay" hidden></div>
  <aside class="detail-panel" id="detailPanel" hidden aria-hidden="true">
    <div class="detail-inner" id="detailInner"></div>
  </aside>

  <script src="js/worldcup/data.js"></script>
  <script src="js/worldcup/render.js"></script>
  <script src="js/worldcup/app.js"></script>
</body>
</html>
